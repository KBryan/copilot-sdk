models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Reply with exactly COAUTHOR_DISABLED_OK.
      - role: assistant
        content: COAUTHOR_DISABLED_OK
