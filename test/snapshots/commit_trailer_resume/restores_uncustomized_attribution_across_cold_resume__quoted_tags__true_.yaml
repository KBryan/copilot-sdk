models:
  - claude-sonnet-5
conversations:
  - messages:
      - role: system
        content: ${system}
      - role: user
        content: Reply with exactly TRAILER_INITIAL_OK.
      - role: assistant
        content: TRAILER_INITIAL_OK
      - role: user
        content: Reply with exactly TRAILER_RESUMED_OK.
      - role: assistant
        content: TRAILER_RESUMED_OK
      - role: user
        content: Reply with exactly TRAILER_OPT_OUT_OK.
      - role: assistant
        content: TRAILER_OPT_OUT_OK
