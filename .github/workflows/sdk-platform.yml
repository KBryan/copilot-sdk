# Runs SDK language checks for one runtime platform as soon as its artifact is
# available. Merge groups retain only the Node.js compatibility lane.
name: "SDK platform"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      sdk-home:
        required: true
        type: string

permissions:
  contents: read

jobs:
  nodejs:
    uses: ./.github/workflows/sdk-nodejs.yml
    with:
      platform: ${{ inputs.platform }}
      sdk-home: ${{ inputs.sdk-home }}
    secrets: inherit

  python:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/sdk-python.yml
    with:
      platform: ${{ inputs.platform }}
      sdk-home: ${{ inputs.sdk-home }}
    secrets: inherit

  go:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/sdk-go.yml
    with:
      platform: ${{ inputs.platform }}
      sdk-home: ${{ inputs.sdk-home }}
    secrets: inherit

  dotnet:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/sdk-dotnet.yml
    with:
      platform: ${{ inputs.platform }}
      sdk-home: ${{ inputs.sdk-home }}
    secrets: inherit

  rust:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/sdk-rust.yml
    with:
      platform: ${{ inputs.platform }}
      sdk-home: ${{ inputs.sdk-home }}
    secrets: inherit

  java:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/sdk-java.yml
    with:
      platform: ${{ inputs.platform }}
      sdk-home: ${{ inputs.sdk-home }}
    secrets: inherit
